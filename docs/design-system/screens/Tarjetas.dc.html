<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;family=Noto+Sans:wght@400&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Figtree', system-ui, sans-serif; }
    button { font-family: inherit; cursor: pointer; }
    svg { flex-shrink: 0; }
  </style>
</helmet>
<div style="width: 1160px; height: 320px; box-sizing: border-box; padding: 40px; background: {{t.bg}}; color: {{t.text}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: stretch;">

  <!-- Mazo A1 — compacta -->
  <section style="background: #cbbcf5; color: #12151c; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em;">TU MAZO</span>
      <span style="flex-grow: 1;"></span>
      <span style="padding: 4px 10px; border-radius: 999px; background: #12151c; color: #ffffff; font-size: 12px; font-weight: 700;">A1</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; display: flex; align-items: baseline; gap: 6px;">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 38px; letter-spacing: -0.03em;">0</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; color: #2c3445;">/ 740</span>
        <span style="font-size: 13px; color: #4a5263; padding-left: 2px;">palabras</span>
      </div>
      <button style="height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #12151c; color: #ffffff; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;">Empezar · 4 min
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <div style="display: flex; gap: 3px;" role="progressbar" aria-label="Palabras aprendidas" aria-valuenow="0" aria-valuemin="0" aria-valuemax="740">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="20">
        <span style="flex-grow: 1; height: 8px; border-radius: 999px; background: {{s.fill}};"></span>
      </sc-for>
    </div>

    <div style="flex-grow: 1; display: flex; align-items: flex-end; gap: 8px;">
      <div style="width: 104px; padding: 8px 10px; box-sizing: border-box; background: #ffffff; border: 2px solid #12151c; border-radius: 12px; transform: rotate(-4deg);">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; line-height: 19px;">hello</div>
        <div style="font-family: 'Noto Sans', sans-serif; font-size: 11px; color: #4a5263;">/həˈloʊ/</div>
      </div>
      <div style="width: 104px; padding: 8px 10px; box-sizing: border-box; background: #ffffff; border: 2px solid #12151c; border-radius: 12px; transform: rotate(3deg);">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; line-height: 19px;">thanks</div>
        <div style="font-family: 'Noto Sans', sans-serif; font-size: 11px; color: #4a5263;">/θæŋks/</div>
      </div>
      <div style="width: 104px; padding: 8px 10px; box-sizing: border-box; background: #ece6fd; border: 2px solid #12151c; border-radius: 12px; transform: rotate(-2deg);">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 17px; line-height: 19px;">please</div>
        <div style="font-family: 'Noto Sans', sans-serif; font-size: 11px; color: #4a5263;">/pliːz/</div>
      </div>
      <div style="flex-grow: 1; text-align: right; font-size: 13px; font-weight: 700; color: #2c3445; padding-bottom: 6px;">+737</div>
    </div>
  </section>

  <!-- Registro de inmersión — compacta -->
  <section style="background: {{t.surface}}; box-shadow: inset 0 0 0 1px {{t.border}}; color: {{t.text}}; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 17px; font-weight: 700; color: {{t.textStrong}};">¿Viste algo en inglés hoy?</span>
        <span style="font-size: 13px; color: {{t.muted}};">Anótalo y lo convierto en práctica.</span>
      </div>
      <span style="padding: 4px 10px; border-radius: 999px; background: #a8e6c9; color: #12151c; font-size: 12px; font-weight: 700;">+2 XP</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <button style="height: 52px; border: 0; border-radius: 16px; background: #f7b7a6; color: #12151c; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;">
        <span style="width: 28px; height: 28px; border-radius: 9px; background: rgba(18,21,28,0.10); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="m16 10 5-3v10l-5-3"></path></svg></span>Video</button>
      <button style="height: 52px; border: 0; border-radius: 16px; background: #cbbcf5; color: #12151c; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;">
        <span style="width: 28px; height: 28px; border-radius: 9px; background: rgba(18,21,28,0.10); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 16v-4a8 8 0 0 1 16 0v4"></path><rect x="3" y="15" width="4" height="6" rx="1.5"></rect><rect x="17" y="15" width="4" height="6" rx="1.5"></rect></svg></span>Podcast</button>
      <button style="height: 52px; border: 0; border-radius: 16px; background: #f8e08e; color: #12151c; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;">
        <span style="width: 28px; height: 28px; border-radius: 9px; background: rgba(18,21,28,0.10); display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg></span>Lectura</button>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; gap: 4px;">
          <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
            <span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: {{d.bg}}; border: {{d.border}};"></span>
          </sc-for>
        </div>
        <span style="font-size: 13px; color: {{t.muted}};">4 días</span>
      </div>
      <span style="flex-grow: 1;"></span>
      <button style="height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: {{accent}}; color: #ffffff; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;">Registrar
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script data-dc-script data-props='{"tema":{"editor":"enum","options":["Oscuro","Claro"],"default":"Oscuro"},"acento":{"editor":"enum","options":["Rojo","Naranja","Ámbar","Verde","Esmeralda","Turquesa","Azul","Violeta","Rosa"],"default":"Azul"},"$preview":{"width":1160,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      Claro: { bg: '#f6f4ef', surface: '#ffffff', raised: '#f1eee7', border: '#e2ddd2', textStrong: '#0a0c11', text: '#12151c', muted: '#4a5263' },
      Oscuro: { bg: '#0d1018', surface: '#141925', raised: '#1b2130', border: '#262d3d', textStrong: '#ffffff', text: '#eef1f7', muted: '#aab2c4' }
    };
    const accents = { 'Rojo': '#dc2626', 'Naranja': '#c2410c', 'Ámbar': '#b45309', 'Verde': '#15803d', 'Esmeralda': '#047857', 'Turquesa': '#0e7490', 'Azul': '#2563eb', 'Violeta': '#7c3aed', 'Rosa': '#be185d' };
    const done = [true, true, false, true, true, false, false];
    const t = themes[this.props.tema] || themes.Oscuro;
    return {
      t: t,
      accent: accents[this.props.acento] || '#2563eb',
      segments: Array.from({ length: 20 }, (_, i) => ({ fill: i === 0 ? '#12151c' : 'rgba(18,21,28,0.12)' })),
      week: done.map(d => ({ bg: d ? '#a8e6c9' : 'transparent', border: d ? '2px solid #12151c' : '2px dashed ' + t.border }))
    };
  }
}
</script>
</body>
</html>
