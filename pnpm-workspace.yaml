overrides:
  postcss: "8.5.25"
  protobufjs: "7.6.5"
  undici: "7.29.0"
  vite: "8.0.16"
  brace-expansion: "5.0.9"
  "js-yaml@4": "4.3.1"
  "nanoid@3": "3.3.18"
  sharp: "0.35.3"
  # Prevent orphaned top-level @supabase/* copies (e.g. 2.102.x) from
  # coexisting with supabase-js@2.108.x — dual postgrest breaks .from() with M_ID.
  "@supabase/auth-js": "2.108.2"
  "@supabase/functions-js": "2.108.2"
  "@supabase/postgrest-js": "2.108.2"
  "@supabase/realtime-js": "2.108.2"
  "@supabase/storage-js": "2.108.2"

allowBuilds:
  '@google/genai': true
  canvas: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

minimumReleaseAgeExclude:
  - '@supabase/cli-darwin-arm64@2.115.0'
  - '@supabase/cli-darwin-x64@2.115.0'
  - '@supabase/cli-linux-arm64-musl@2.115.0'
  - '@supabase/cli-linux-arm64@2.115.0'
  - '@supabase/cli-linux-x64-musl@2.115.0'
  - '@supabase/cli-linux-x64@2.115.0'
  - '@supabase/cli-windows-arm64@2.115.0'
  - '@supabase/cli-windows-x64@2.115.0'
  - supabase@2.115.0
