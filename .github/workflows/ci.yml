name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint, Type Check & Test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm lint
        name: Run ESLint

      - run: pnpm type-check
        name: TypeScript type check

      - run: pnpm test:coverage
        name: Run tests with coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check migration safety
        run: pnpm check:migrations

      - name: Audit RLS coverage
        run: pnpm audit:rls

      - name: Design Token Validation
        run: pnpm lint:design-tokens

      - name: Validate Core 1000 dataset
        run: pnpm validate:core1000

      - name: Validate Core 1000 generators
        run: pnpm validate:core1000-generators

  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

      - name: Check for hardcoded secrets
        run: pnpm scan:secrets

  build:
    runs-on: ubuntu-latest
    name: Build & Bundle
    needs: [lint-and-test, security-audit]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Server-side key; mock value is safe here — never reaches the client
          # and is only required to satisfy env validation at build time.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-build-placeholder' }}

      - name: Smoke check build output
        run: |
          echo "Verifying build artifact integrity..."
          test -f .next/BUILD_ID        || (echo "Missing .next/BUILD_ID" && exit 1)
          test -f .next/routes-manifest.json || (echo "Missing routes-manifest.json" && exit 1)
          test -d .next/server          || (echo "Missing .next/server directory" && exit 1)
          echo "Build artifact looks valid. BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Analyze bundle sizes
        run: pnpm analyze:bundle:check

      - name: Upload bundle summary
        uses: actions/upload-artifact@v4
        with:
          name: bundle-summary
          path: bundle-summary.json
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 5

  accessibility-audit:
    runs-on: ubuntu-latest
    name: A11y & Design Quality Check

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright axe audit
        run: pnpm test:a11y
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-placeholder' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-gemini-placeholder' }}

      - name: Verify design tokens used
        run: |
          hardcoded=$(grep -r "oklch(0\." components/ui --include="*.tsx" | grep -v "var(--hue)" | wc -l)
          echo "Hard-coded colors found: $hardcoded (should be < 2)"
          if [ "$hardcoded" -gt 2 ]; then
            echo "⚠️ Too many hard-coded colors detected"
            exit 1
          fi

  notify-status:
    runs-on: ubuntu-latest
    name: Notify Build Status
    needs: [lint-and-test, security-audit, build, accessibility-audit]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "❌ Lint/Test failed"
            exit 1
          fi
          echo "✅ CI Pipeline passed"
