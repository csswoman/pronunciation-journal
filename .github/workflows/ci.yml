name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint, Type Check & Test
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm lint
        name: Run ESLint

      - run: pnpm type-check
        name: TypeScript type check

      - name: Audit integrated learning loop
        run: pnpm audit:learning-loop

      - name: Verify learning-loop integrations
        run: pnpm test:learning-loop:integration

      - run: pnpm test:coverage
        name: Run tests with coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check migration safety
        run: pnpm check:migrations

      - name: Audit RLS coverage
        run: pnpm audit:rls

      - name: Design Token Validation
        run: pnpm lint:design-tokens

      - name: Audit AI prompt boundaries
        run: pnpm audit:ai-prompts

      - name: Audit Dexie/Zustand state duplication
        run: pnpm audit:state-duplication

      - name: Validate Essential Words dataset
        run: pnpm validate:essential-words

      - name: Validate Essential Words generators
        run: pnpm validate:essential-words-generators

  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=low

      - name: Check for hardcoded secrets
        run: pnpm scan:secrets

  build:
    runs-on: ubuntu-latest
    name: Build & Bundle
    needs: [lint-and-test, security-audit]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-placeholder' }}
          # Server-side mock placeholder is used during CI build — production secret is never supplied to build
          GEMINI_API_KEY: "ci-build-placeholder"

      - name: Smoke check build output
        run: |
          echo "Verifying build artifact integrity..."
          test -f .next/BUILD_ID        || (echo "Missing .next/BUILD_ID" && exit 1)
          test -f .next/routes-manifest.json || (echo "Missing routes-manifest.json" && exit 1)
          test -d .next/server          || (echo "Missing .next/server directory" && exit 1)
          echo "Build artifact looks valid. BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Analyze bundle sizes
        run: pnpm analyze:bundle:check

      - name: Upload bundle summary
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: bundle-summary
          path: bundle-summary.json
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: nextjs-build
          path: .next/
          retention-days: 5

  accessibility-audit:
    runs-on: ubuntu-latest
    name: A11y & Design Quality Check
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright axe audit
        run: pnpm test:a11y
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-placeholder' }}
          GEMINI_API_KEY: "ci-gemini-placeholder"

  notify-status:
    runs-on: ubuntu-latest
    name: Notify Build Status
    needs: [lint-and-test, security-audit, build, accessibility-audit]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "❌ Lint/Test failed"
            exit 1
          fi
          echo "✅ CI Pipeline passed"
